<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#12132200"/>
    </linearGradient>
    <linearGradient id="bgFill" x1="160" y1="120" x2="880" y2="920" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#171A2B"/>
      <stop offset="1" stop-color="#0A0B12"/>
    </linearGradient>
    <linearGradient id="bird" x1="300" y1="300" x2="760" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8E9BFF"/>
      <stop offset="0.55" stop-color="#6E7EFF"/>
      <stop offset="1" stop-color="#54E6FF"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0"/>
    </filter>
  </defs>

  <!-- rounded-square backdrop -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#bgFill)"/>
  <rect x="0.5" y="0.5" width="1023" height="1023" rx="229.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2"/>

