# Windows-only launcher-icon config, applied in CI after `flutter create`
# regenerates the (gitignored) windows/ runner. Keeps the desktop .exe icon in
# sync with the committed android/macos icons without committing windows/.
flutter_launcher_icons:
  image_path: "assets/icon/talon_icon.png"
  android: false
  ios: false
  windows:
    generate: true
    image_path: "assets/icon/talon_icon.png"
    icon_size: 256
